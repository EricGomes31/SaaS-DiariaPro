name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  lint-and-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run depcruise
      - name: Knip (advisory — pre-existing findings not yet cleaned up, see #14)
        run: npm run knip || true

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  e2e:
    # Needs VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY as repo secrets (Settings →
    # Secrets and variables → Actions) — ideally pointing at a dedicated test/staging
    # Supabase project, not production. Without them the app fails to boot
    # (createClient throws on a missing URL) and every e2e test fails at the first
    # navigation. hCaptcha needs no secret: Captcha.jsx already falls back to
    # hCaptcha's public always-passes test site key when VITE_HCAPTCHA_SITE_KEY
    # is unset.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
